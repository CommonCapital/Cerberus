name: Feature request
description: Something Cerberus should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Authorization and safety
      description: If it acts on a target or runs tools, how does it stay within an engagement's scope and the operator's consent?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
