name: Bug report
description: Something in Cerberus does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A security vulnerability in Cerberus?** Do not report it here: see SECURITY.md.
        Leave out API keys, passwords, tokens and anything from a system you are not allowed to share.
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [.NET backend, CLI, TypeScript server, Docker / compose, Catalogs, Skills, Documentation]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands, requests or CLI steps, and the settings that matter (CERBERUS_*, which model).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages, log lines, or GET /health/ready. Remove secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main at abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. macOS 15, .NET 10.0.1, Bun 1.3.14, PostgreSQL 17
