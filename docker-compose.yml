# Cerberus — everything as local containers. Nothing here needs a cloud service.
#
#   docker compose up -d                      # the API (the one backend)
#   docker compose run --rm cli               # the terminal client, attached to your terminal
#
# Optional parts are files of their own, added with -f (see each file's header):
#   docker compose -f docker-compose.yml -f compose.models.yml up -d   # + Ollama (local models; heavy)
#   docker compose -f docker-compose.yml -f compose.infra.yml up -d    # + RabbitMQ and Redis
#   docker compose -f docker-compose.yml -f compose.web.yml up -d      # + SearXNG, a search service of your own
#
# They are separate files, not profiles, because two of them need a secret, and a required
# variable (${NAME:?…}) is checked for the whole file whether or not its service is started:
# as profiles in this file they stopped a plain "docker compose up" on a machine with no .env.
#
# Settings come from a .env file next to this one (copy .env.example). All are optional here.
# First built and started on 2026-11-14 (PLAN.md §15 has what that run changed).

name: cerberus

services:
  # The backend: auth, sessions, chat, scans, compliance, jobs, approvals,
  # questions, skills, and the SignalR hubs. One process, SQLite on a volume.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: cerberus-api:local
    restart: unless-stopped
    ports:
      # Published on this machine only. Change the left side to expose it, or to move it off 3000.
      - "127.0.0.1:${CERBERUS_PORT:-3000}:3000"
    environment:
      # Model keys are optional; without them, cloud models report "no API key".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Only reachable when the "models" profile is running.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      # Internet access for agents is off unless switched on. With the "web" profile running,
      # also set CERBERUS_SEARXNG_URL so the researcher can search and not only fetch.
      CERBERUS_WEB: ${CERBERUS_WEB:-off}
      CERBERUS_SEARXNG_URL: ${CERBERUS_SEARXNG_URL:-}
      # A browser for the researcher (needs Chromium in the image — see backend/Dockerfile — and CERBERUS_WEB=on).
      CERBERUS_BROWSER: ${CERBERUS_BROWSER:-off}
      # Comma-separated names that must never appear in anything sent to the internet.
      CERBERUS_EGRESS_BLOCKED_TERMS: ${CERBERUS_EGRESS_BLOCKED_TERMS:-}
      # Outside tool servers (MCP) for the researcher: mount a JSON file and name it here (see README.md).
      # Tokens belong in the environment, referenced from the file as "env:NAME".
      # CERBERUS_MCP_CONFIG: /config/mcp.json
      # Uncomment to change behaviour (see backend/README.md):
      # CERBERUS_REQUIRE_ENGAGEMENT: "true"
      # CERBERUS_JOB_TIMEOUT_SECONDS: "600"
      # CERBERUS_JOB_CONCURRENCY: "2"
      # The most jobs one person may run at once (0 = no limit; the next free place goes to whoever has fewest either way):
      # CERBERUS_JOB_PER_USER: "0"
      # RabbitMQ between accepting work and doing it: compose.infra.yml sets CERBERUS_RABBITMQ_URL for this service.
      # Chat turns answered at once, in all and per user:
      # CERBERUS_CHAT_CONCURRENCY: "4"
      # CERBERUS_CHAT_PER_USER: "2"
      # How many specialists of a team review work at once with an API model (1-4):
      # CERBERUS_AGENT_PARALLELISM: "2"
      # CERBERUS_QUESTION_TIMEOUT_SECONDS: "3600"
    volumes:
      # Database and encryption key ring. Losing this volume loses accounts,
      # scans, the audit log, and the ability to read stored API keys.
      - cerberus-data:/data
      # The code to scan, read-only. Defaults to this repository; point
      # CERBERUS_TARGET at any directory you are authorized to test.
      - ${CERBERUS_TARGET:-.}:/workspace:ro
    # The process needs none of a container's extra powers: no capabilities, no way to gain any, and a
    # file system it cannot write to except /data (the volume) and /tmp (memory, gone with the container).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The server binary checks itself: its "health" mode asks /health/ready and exits 0 when the
      # service is ready (healthy or degraded), 1 when something it cannot work without is missing.
      test: ["CMD", "dotnet", "Cerberus.Api.dll", "health"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s

  # The terminal client. Interactive, so it is not started by "up":
  #   docker compose run --rm cli
  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: packages/cli/Dockerfile
    image: cerberus-cli:local
    stdin_open: true
    tty: true
    # No capabilities and no way to gain any. Its file system stays writable: it edits the mounted project.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      API_URL: http://api:3000
      # For "run" jobs without the interactive screen: a sign-in token from the environment.
      CERBERUS_TOKEN: ${CERBERUS_TOKEN:-}
    volumes:
      # Your session token, kept between runs.
      - cerberus-cli-home:/home/bun
      # The project the CLI's file tools act on (read-write: BUILD mode edits files).
      - ${CERBERUS_TARGET:-.}:/workspace
    depends_on:
      api:
        condition: service_healthy

volumes:
  cerberus-data:
  cerberus-cli-home:
